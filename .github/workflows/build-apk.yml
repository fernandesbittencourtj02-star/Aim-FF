
name: Compilar Mira APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiraPersonalizada-Android-Nuvem.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip MiraPersonalizada-Android-Nuvem.zip -d projeto

      - name: Compilar APK
        run: gradle -p projeto assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MiraPersonalizada-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          
